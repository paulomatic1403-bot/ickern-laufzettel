<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#ffffff">
<title>Laufzettel Athletik · Westfalenauswahl Ickern</title>
<style>
/* WTV Farben laut WTV_Uebungskatalog.xlsm. Rot nur als Akzent, Text auf Rot in dunklerem Rot (#B5121B) für WCAG AA */
:root{--ink:#262626;--ink2:#595959;--line:#D9D9D9;--line2:#BFBFBF;--grey:#F2F2F2;--bg:#FAFAFA;--lime:#E6F3A1;--limeD:#C9E26A;--red:#EC1C24;--redD:#B5121B;--white:#fff;--r:10px;--nav:68px}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:Calibri,Carlito,"Segoe UI",system-ui,-apple-system,sans-serif;color:var(--ink);background:var(--bg);font-size:17px;line-height:1.4}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--red);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* Kopf */
header.top{position:sticky;top:0;z-index:20;background:var(--white);border-top:4px solid var(--red);border-bottom:1px solid var(--line);padding:8px 16px calc(8px)}
.topin{max-width:760px;margin:0 auto;display:flex;align-items:center;gap:10px}
.brand{flex:1;min-width:0}
.eyebrow{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink2);font-weight:700}
.sess{font-size:19px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.status{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--ink2);white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;background:var(--line2)}
.status.ok .dot{background:#2E7D32}.status.todo .dot{background:var(--red)}
.iconbtn{min-width:44px;min-height:44px;border:1px solid var(--line);background:var(--white);border-radius:var(--r);cursor:pointer;font-weight:700}

main{max-width:760px;margin:0 auto;padding:12px 16px calc(var(--nav) + 28px)}
.card{background:var(--white);border:1px solid var(--line);border-radius:14px;padding:16px;margin:0 0 14px}
h2{font-size:20px;margin:0 0 10px}
h3{font-size:15px;margin:16px 0 8px;color:var(--ink2);text-transform:uppercase;letter-spacing:.05em}
.h2row{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.big{font-size:28px;font-weight:700;font-variant-numeric:tabular-nums}
.hint{color:var(--ink2);font-size:14px;margin:6px 0 0}
.lbl{display:block;font-weight:700;font-size:15px;margin:0 0 6px}
label.lbl{cursor:pointer}
.field{margin:0 0 12px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
input,select,textarea{width:100%;min-height:46px;padding:10px 12px;border:1px solid var(--line2);border-radius:var(--r);background:var(--lime)}
input:focus,select:focus,textarea:focus{background:var(--white);border-color:var(--ink)}
textarea{min-height:84px;resize:vertical}
details>summary{cursor:pointer;min-height:44px;display:flex;align-items:center;gap:8px;font-weight:700;list-style:none}
details>summary::-webkit-details-marker{display:none}
details>summary::before{content:"›";display:inline-block;transition:transform .15s;font-size:22px;line-height:1;width:14px}
details[open]>summary::before{transform:rotate(90deg)}
ul.fokus{margin:4px 0 0;padding-left:20px;color:var(--ink2)}
ul.fokus li{margin:4px 0}

/* Knöpfe */
.btn{min-height:48px;padding:10px 18px;border-radius:var(--r);border:1px solid var(--ink);background:var(--white);font-weight:700;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.primary{background:var(--ink);color:var(--white)}
.btn.ghost{border-color:var(--line2)}
.btn.danger{border-color:var(--line2);color:var(--redD)}
.btn.wide{width:100%}
.btn[disabled]{opacity:.5;cursor:default}
.btnrow{display:flex;gap:10px;flex-wrap:wrap}.btnrow>.btn{flex:1 1 160px}
.segs{display:flex;gap:6px;flex-wrap:wrap}
.seg{min-height:44px;min-width:52px;padding:8px 12px;border:1px solid var(--line2);background:var(--white);border-radius:var(--r);cursor:pointer;font-weight:700}
.seg[aria-pressed="true"]{background:var(--ink);color:var(--white);border-color:var(--ink)}
.segs.fill .seg{flex:1 1 0;min-width:0;padding:8px 4px}
.segs.two{display:grid;grid-template-columns:1fr 1fr}

/* Kinder Chips */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:44px;padding:8px 14px;border:1px solid var(--line2);border-radius:999px;background:var(--white);cursor:pointer;display:inline-flex;align-items:center;gap:6px;text-align:left}
.chip small{color:var(--ink2);font-size:12px}
.chip .ck{display:none;font-weight:700}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--white);border-color:var(--ink)}
.chip[aria-pressed="true"] small{color:#D9D9D9}
.chip[aria-pressed="true"] .ck{display:inline}
.grp{margin-top:14px}
.grp>.gh{font-size:13px;font-weight:700;color:var(--ink2);margin:0 0 6px;text-transform:uppercase;letter-spacing:.05em}
.attrow{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--grey)}
.attrow:last-child{border-bottom:0}
.attrow .nm{flex:1;font-weight:700}
.attrow.fehlt .nm{color:var(--ink2);text-decoration:line-through}
.search{position:relative}
.empty{text-align:center;padding:24px 12px;color:var(--ink2)}
.empty p{margin:0 0 12px}

/* Bewertung */
.legend{gap:4px 10px;position:sticky;top:var(--hh,80px);z-index:10;background:var(--bg);padding:8px 0;display:flex;flex-wrap:wrap;font-size:13px;color:var(--ink2)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend .sw{display:inline-grid;place-items:center}
.sw{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:6px;font-weight:700;font-size:13px}
.r1,.sw.r1{--on:#595959;--onT:#fff}.r2,.sw.r2{--on:var(--limeD);--onT:var(--ink)}.r3,.sw.r3{--on:var(--ink);--onT:#fff}.rp,.sw.rp{--on:var(--redD);--onT:#fff}
.sw{background:var(--on);color:var(--onT)}
.rrow{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--grey)}
.rrow:last-child{border-bottom:0}
.rrow .rl{flex:1;min-width:0;hyphens:auto;-webkit-hyphens:auto;overflow-wrap:anywhere}
.rrow .rl b{display:block}
.rate{display:flex;gap:6px}
.r{width:46px;height:46px;border:1px solid var(--line2);border-radius:var(--r);background:var(--white);font-weight:700;font-size:18px;cursor:pointer}
.r[aria-pressed="true"]{background:var(--on);color:var(--onT);border-color:var(--on)}
.kidstrip{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 10px;scroll-snap-type:x proximity;-webkit-overflow-scrolling:touch}
.kidstrip .chip{flex:0 0 auto;scroll-snap-align:start}
.prog{font-size:12px;font-variant-numeric:tabular-nums;border-radius:999px;padding:1px 7px;background:var(--grey);color:var(--ink)}
.chip[aria-pressed="true"] .prog{background:#4A4A4A;color:#fff}
.prog.full{background:var(--lime);color:var(--ink)}
.kidhead{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.kidhead h2{flex:1;margin:0;font-size:24px}
.sec{font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;border-left:4px solid var(--red);padding-left:8px;margin:20px 0 6px}
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.mgrid label{font-size:14px;color:var(--ink2);display:block;margin-bottom:4px}
.kritbar{display:flex;flex-direction:column;gap:8px}
.kritbar .chips{gap:6px}
.kritbar .chip{min-height:40px;padding:6px 12px;font-size:15px}
.mrow input{width:120px;min-height:44px}

/* Staffeln */
.stcard summary{justify-content:space-between}
.stcard summary .sm{font-weight:400;color:var(--ink2);font-size:14px}
.teamhead{display:flex;gap:10px;align-items:center;justify-content:space-between;margin:8px 0}
.pill{font-size:13px;font-weight:700;border-radius:999px;padding:3px 10px;background:var(--grey)}
.pill.a{background:var(--ink);color:#fff}.pill.b{background:var(--lime)}
.seg.ta[aria-pressed="true"]{background:var(--ink);color:#fff}
.seg.tb[aria-pressed="true"]{background:var(--lime);color:var(--ink);border-color:var(--limeD)}

/* Übersicht */
table{border-collapse:collapse;width:100%;font-size:15px}
th,td{padding:10px 6px;border-bottom:1px solid var(--grey);text-align:left;font-variant-numeric:tabular-nums}
th{font-size:13px;color:var(--ink2);text-transform:uppercase;letter-spacing:.04em}
td button.link{background:none;border:0;padding:0;font-weight:700;text-decoration:underline;cursor:pointer;min-height:32px;text-align:left}
.warn{background:#FFF4F4;border:1px solid #F3C2C4;border-radius:var(--r);padding:10px 12px;color:var(--redD);font-size:15px;margin:10px 0}

/* Navigation unten */
nav.steps{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--white);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav.steps .in{max-width:760px;margin:0 auto;display:flex}
nav.steps button{flex:1;min-height:var(--nav);border:0;background:none;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--ink2);border-top:3px solid transparent;font-size:14px;position:relative}
nav.steps button .n{font-size:12px;font-weight:700;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--line2)}
nav.steps button[aria-current="page"]{color:var(--ink);font-weight:700;border-top-color:var(--red)}
nav.steps button[aria-current="page"] .n{background:var(--ink);color:#fff;border-color:var(--ink)}
nav.steps .badge{position:absolute;top:6px;left:calc(50% + 10px);font-size:11px;font-weight:700;background:var(--lime);border-radius:999px;padding:0 6px;color:var(--ink)}

/* Panels und Menü */
.overlay{position:fixed;inset:0;z-index:40;background:rgba(38,38,38,.4);display:none}
.overlay.on{display:block}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;background:var(--white);border-radius:16px 16px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom));max-width:760px;margin:0 auto;display:none}
.sheet.on{display:block}
.sheet .btn{width:100%;justify-content:flex-start;margin-bottom:8px}
.panel{position:fixed;inset:0;z-index:42;background:var(--bg);overflow:auto;display:none}
.panel.on{display:block}
.panel .phead{position:sticky;top:0;background:var(--white);border-bottom:1px solid var(--line);border-top:4px solid var(--red);padding:8px 16px;display:flex;align-items:center;gap:10px;z-index:2}
.panel .phead h2{margin:0;flex:1}
.panel .pin{max-width:760px;margin:0 auto;padding:16px}
.hrow{display:flex;align-items:center;gap:10px}
.hrow .meta{flex:1;min-width:0}
.tag{display:inline-block;font-size:12px;font-weight:700;border-radius:999px;padding:2px 8px;background:var(--grey);margin-left:4px}
.tag.prep{background:var(--lime)}.tag.up{background:#E3F1E4;color:#1B5E20}.tag.cur{background:var(--ink);color:#fff}

.toast{position:fixed;left:50%;bottom:calc(var(--nav) + 14px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 12px 10px 16px;border-radius:12px;display:none;z-index:50;align-items:center;gap:12px;max-width:calc(100% - 24px);box-shadow:0 6px 20px rgba(0,0,0,.18)}
.toast.on{display:flex}
.toast button{background:none;border:1px solid #fff;color:#fff;border-radius:8px;min-height:36px;padding:4px 12px;font-weight:700;cursor:pointer}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media (max-width:370px){.r{width:40px;height:44px}.rate{gap:4px}}
</style>
</head>
<body>
<header class="top">
  <div class="topin">
    <div class="brand">
      <div class="eyebrow">WTV Westfalenauswahl Ickern</div>
      <div class="sess" id="sess"></div>
      <div class="status" id="status" role="status" aria-live="polite"><span class="dot"></span><span id="statusT"></span></div>
    </div>
    <button class="iconbtn" data-act="menu" aria-label="Menü öffnen" aria-haspopup="dialog">☰</button>
  </div>
</header>

<main id="view" tabindex="-1"></main>

<nav class="steps" aria-label="Ablauf der Einheit"><div class="in" id="steps"></div></nav>

<div class="overlay" id="overlay" data-act="close"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetT">
  <h2 id="sheetT">Menü</h2>
  <button class="btn ghost" data-act="panel" data-p="verlauf">Verlauf und vorbereitete Einheiten</button>
  <button class="btn ghost" data-act="panel" data-p="setup">Kader und GitHub Verbindung</button>
  <button class="btn ghost" data-act="neu">Neue leere Einheit beginnen</button>
  <button class="btn" data-act="close">Schließen</button>
</div>
<section class="panel" id="panel" role="dialog" aria-modal="true" aria-labelledby="panelT">
  <div class="phead"><button class="iconbtn" data-act="close" aria-label="Zurück">←</button><h2 id="panelT" tabindex="-1"></h2></div>
  <div class="pin" id="panelBody"></div>
</section>
<div class="toast" id="toast" role="status" aria-live="polite"><span id="toastT"></span><button id="toastB" hidden></button></div>

<script>
// ---------- Konfiguration je Altersklasse (Quellen: Sichtungsberichte Kamen 11/2026, Herbstlehrgang 2026, DTB Talent Cup Wettspielordnung und Testmanual 2025) ----------
const PERS=["Ehrgeiz","Durchhalten","Selbstständig","Umgang mit Fehlern","Freude","Coachbar","Team"];
const CFG={
 U9:{jg:"Jahrgang 2017, ab 2027 Jahrgang 2018",jgs:[2017,2018],staffel:true,
  fokus:["Allgemeine athletische Grundausbildung, Laufkoordination, Sprungschule","Richtungswechsel mit Abbremsen und Recovery Schritt","Rotationskraft über seitliche Medizinballwürfe","Vielseitigkeit ohne frühe Spezialisierung, relatives Alter mitdenken"],
  mess:["20 m [s]","RWS VH [s]","RWS RH [s]","SWS [cm]","3er-Hop [cm]","MB ÜK [cm]"],
  mot:["Laufkoordination","Sprung und Landung","Wurf und Rotation","Abbremsen","Ballgeschick"]},
 U10:{jg:"Jahrgang 2016, ab 2027 Jahrgang 2017",jgs:[2016,2017],staffel:true,
  fokus:["Heranführen an den DTB Talent Performance Test","Konditionswettbewerbe als Staffel aus allen vier Töpfen","Mannschaftsspiele aus dem Talent Cup, Spielfähigkeit und Teamverhalten","Körpermaße für das biologische Alter erfassen"],
  mess:["20 m [s]","RWS gesamt [s]","SWS [cm]","CMJ oder 3er-Hop","Ballwurf [km/h oder m]","MB ÜK 1 kg [cm]","Größe [cm]","Sitzgröße [cm]"],
  mot:["Antritt und Laufen","Richtungswechsel","Sprungtechnik","Wurftechnik","Spielfähigkeit"]},
 U11:{jg:"Jahrgang 2015, ab 2027 Jahrgang 2016",jgs:[2015,2016],staffel:true,
  fokus:["Komplette Talent Performance Test Batterie unter Wettkampfbedingungen","Jedes Kind in jeder Disziplin einsetzbar (Ersatzspielerregelung)","Wettkampf und Teamverhalten unter Druck","Körpermaße, ab 1 Jahr Abweichung früh oder spät entwickelt"],
  mess:["Tapping [Hz/n]","20 m [s]","RWS VH [s]","RWS RH [s]","CMJ [cm]","SWS [cm]","Ballwurf","MB ÜK 1 kg [cm]"],
  mot:["Schnelligkeit","Richtungswechsel","Sprung","Wurf","Spielfähigkeit"]},
 U12:{jg:"Jahrgang 2014, ab 2027 Jahrgang 2015",jgs:[2014,2015],staffel:false,
  fokus:["Tennisspezifische Athletik: 20 m, 5-10-5, Standweitsprung beid und einbeinig, 30-15 IFT","Abbremsen im Open Stance, Seitendifferenz dokumentieren","Technik der Grundmuster Kniebeuge, Ausfallschritt, Hüftstreckung","Wachstum im Blick behalten"],
  mess:["20 m [s]","5-10-5 R [s]","5-10-5 L [s]","SWS [cm]","SWS einbeinig R/L [cm]","30-15 IFT [km/h]","Größe [cm]"],
  mot:["Bremsen und Open Stance","Rotation","Grundmuster","Rumpf","Einbeinige Landung"]},
 U13:{jg:"Jahrgang 2013, ab 2027 Jahrgang 2014",jgs:[2013,2014],staffel:false,
  fokus:["Tennisspezifische Athletik plus Medizinball Vorhand, Rückhand, Überkopf","Grundkraft technisch sauber, Belastbarkeit","Wachstum und biologisches Alter beachten","Selbstständigkeit und Trainingsdisziplin"],
  mess:["20 m [s]","5-10-5 R/L [s]","SWS [cm]","MB VH/RH [cm]","MB ÜK [cm]","30-15 IFT [km/h]","Größe [cm]"],
  mot:["Bremsen und Richtungswechsel","Rotation","Grundmuster","Rumpf","Belastbarkeit"]}
};
const TOEPFE={"Geschicklichkeit":["Ballholen","Fang-Ziel-Werfen","Pendelstaffel 1","Pendelstaffel 2","Ball rollen","Koordinationsslalom","Prellslalom","Hürden/Eimer-Lauf","Dribbel-Achter-Lauf"],
 "Sprung":["Dreisprung","Sprung einbeinig","Wechselsprünge Staffel"],
 "Wurf":["Beidarmiges Stoßen","Seitlicher Medizinballwurf","Medizinball rückwärts über Kopf","Medizinball frontal von unten"],
 "Lauf":["Grundliniensprint","Fächerlauf 1","Fächerlauf 2","Sprint im Tennisfeld","Balltransportsprint","Biathlon","Vier-Ecken-Lauf","Achterlauf","Hole und bringe den Ball","T-Run"]};
const ST_KRIT=["Tempo","Ausführung","Wechsel und Übergabe","Regeln","Teamgeist","Unter Druck"];
const SCALE=[["1","noch nicht"],["2","teilweise"],["3","sicher"],["+","auffällig stark"]];
const TAGS=["konzentriert","abgelenkt","mutig","zurückhaltend","hilft anderen","fragt nach","gibt schnell auf","übernimmt Führung","Beschwerden gemeldet"];
const STIMMUNG=["sehr gut","gut","gemischt","unruhig","müde"];
const TABS=[["kinder","Kinder"],["bewerten","Bewerten"],["staffeln","Staffeln"],["abschluss","Abschluss"]];

// ---------- Speicher ----------
const store={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},
 set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){toast("Speichern im Browser nicht möglich")}}};
let kader=store.get("ick_kader",[]);
let sync=store.get("ick_sync",{});sync={repo:sync.repo||"paulomatic1403-bot/ickern-daten",branch:sync.branch||"main",token:sync.token||""};
const today=()=>{const d=new Date();return new Date(d-d.getTimezoneOffset()*6e4).toISOString().slice(0,10)};
function neu(){return{id:Date.now().toString(36),datum:today(),ak:"U10",lg:"",trainer:"",dauer:"",thema:"",angemeldet:[],anwesend:[],kinder:{},staffeln:[],staffelKinder:{},gruppe:{inhalte:"",rpe:"",stimmung:"",bes:"",fragen:""}}}
function norm(e){const b=neu();e={...b,...e,gruppe:{...b.gruppe,...(e.gruppe||{})}};
 ["angemeldet","anwesend","staffeln","offen","abgesagt"].forEach(k=>{if(!Array.isArray(e[k]))e[k]=[]});e.gruppen=e.gruppen||{};e.gf=e.gf||"";e.kinder=e.kinder||{};e.staffelKinder=e.staffelKinder||{};if(!CFG[e.ak])e.ak="U10";return e}
let S=norm(store.get("ick_current",null)||neu());
const ui={tab:"kinder",mode:"kind",kid:null,krit:0,stKrit:0,openSt:-1,other:false,q:""};
function persist(){store.set("ick_current",S);const h=store.get("ick_hist",{});h[S.id]=S;store.set("ick_hist",h)}
function save(){S.synced=false;S.changed=Date.now();persist();head()}

const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const disp=n=>{const p=String(n).split(",").map(x=>x.trim());return p.length>1&&p[1]?p[1]+" "+p[0]:n};
const sortN=(a,b)=>a.localeCompare(b,"de");
const kidOf=n=>{const d=S.kinder[n]||(S.kinder[n]={mess:{},mot:{},pers:{},notiz:"",tags:[]});d.mess=d.mess||{};d.mot=d.mot||{};d.pers=d.pers||{};d.tags=d.tags||[];return d};
const total=()=>{const c=CFG[S.ak];return c.mess.length+c.mot.length+PERS.length};
const done=n=>{const d=S.kinder[n];if(!d)return 0;return[d.mess,d.mot,d.pers].reduce((a,o)=>a+Object.values(o||{}).filter(Boolean).length,0)};
const crits=()=>{const c=CFG[S.ak];return[...c.mess.map(k=>({g:"mess",k,sec:"Messwerte"})),...c.mot.map(k=>({g:"mot",k,sec:"Motorik"})),...PERS.map(k=>({g:"pers",k,sec:"Persönlichkeit"}))]};
const fmtD=d=>{try{return new Date(d+"T12:00").toLocaleDateString("de-DE",{weekday:"short",day:"2-digit",month:"2-digit",year:"numeric"})}catch(e){return d}};
const grpOf=n=>S.gruppen[n]||"";
const hasGrp=()=>S.anwesend.some(n=>grpOf(n));
const grpOn=()=>!!S.useGrp||hasGrp();
const AL=()=>S.gf&&hasGrp()?S.anwesend.filter(n=>grpOf(n)===S.gf||!grpOf(n)):S.anwesend;
const fmtS=d=>{try{return new Date(d+"T12:00").toLocaleDateString("de-DE",{weekday:"short",day:"2-digit",month:"2-digit"})}catch(e){return d}};
const tabsFor=()=>TABS.filter(t=>t[0]!=="staffeln"||CFG[S.ak].staffel);

let tT;function toast(t,act){const e=$("toast"),b=$("toastB");$("toastT").textContent=t;
 if(act){b.hidden=false;b.textContent=act.label;b.onclick=()=>{act.fn();e.classList.remove("on")}}else b.hidden=true;
 e.classList.add("on");clearTimeout(tT);tT=setTimeout(()=>e.classList.remove("on"),act?6000:2600)}

// ---------- Kopf und Navigation ----------
function head(){
 $("sess").textContent=`${S.ak} · ${fmtS(S.datum)}${S.lg?" · LG "+S.lg:""}${S.gf&&hasGrp()?" · Gr. "+S.gf:""}`;
 const st=$("status");st.className="status "+(S.synced?"ok":(S.changed?"todo":""));
 $("statusT").textContent=S.synced?"In GitHub hochgeladen "+(S.syncedAt||""):(S.changed?"Gespeichert, noch nicht hochgeladen":"Noch keine Eingaben");
 document.documentElement.style.setProperty("--hh",document.querySelector("header.top").offsetHeight+"px");
 const tabs=tabsFor();if(!tabs.find(t=>t[0]===ui.tab))ui.tab="kinder";
 const badge={kinder:S.anwesend.length||"",bewerten:S.anwesend.length?S.anwesend.filter(n=>done(n)>0).length+"/"+S.anwesend.length:"",staffeln:S.staffeln.length||"",abschluss:""};
 $("steps").innerHTML=tabs.map(([k,l],i)=>`<button data-act="tab" data-tab="${k}" ${ui.tab===k?'aria-current="page"':""}><span class="n" aria-hidden="true">${i+1}</span>${l}${badge[k]!==""?`<span class="badge">${badge[k]}</span>`:""}</button>`).join("");
}
function go(t){ui.tab=t;render();window.scrollTo(0,0);$("view").focus({preventScroll:true})}
function render(){head();$("view").innerHTML=({kinder:vKinder,bewerten:vBewerten,staffeln:vStaffeln,abschluss:vAbschluss}[ui.tab])()}

const segs=(act,cur,opts,extra="")=>`<div class="segs ${extra}">`+opts.map(([v,l])=>`<button type="button" class="seg" data-act="${act}" data-v="${esc(v)}" aria-pressed="${cur===v}">${esc(l)}</button>`).join("")+"</div>";
const rate=(n,g,k,val,lab)=>`<div class="rate" role="group" aria-label="${esc(lab)}">`+SCALE.map(([r,t])=>`<button type="button" class="r r${r==="+"?"p":r}" data-act="rate" data-kid="${esc(n)}" data-g="${g}" data-k="${esc(k)}" data-r="${r}" aria-pressed="${val===r}" aria-label="${r}, ${t}">${r}</button>`).join("")+"</div>";
const legend=()=>`<div class="legend" aria-label="Skala">${SCALE.map(([r,t])=>`<span><span class="sw r${r==="+"?"p":r}">${r}</span>${t}</span>`).join("")}</div>`;
const emptyBox=(t,btn)=>`<div class="card empty"><p>${t}</p>${btn||""}</div>`;

// ---------- 1 Kinder ----------
function vKinder(){
 const c=CFG[S.ak];
 let h=`<section class="card"><h2>Einheit</h2>
  <div class="field"><span class="lbl" id="akl">Altersklasse</span><div role="group" aria-labelledby="akl">${segs("ak",S.ak,Object.keys(CFG).map(a=>[a,a]),"fill")}</div><p class="hint">${esc(c.jg)}</p></div>
  <div class="grid2"><div class="field"><label class="lbl" for="f_datum">Datum</label><input id="f_datum" type="date" data-head="datum" value="${esc(S.datum)}"></div>
  <div class="field"><label class="lbl" for="f_lg">LG Nummer</label><input id="f_lg" inputmode="numeric" data-head="lg" value="${esc(S.lg)}" placeholder="z. B. 5"></div></div>
  <details><summary>Trainer, Dauer und Thema</summary><div class="grid2"><div class="field"><label class="lbl" for="f_tr">Trainer</label><input id="f_tr" data-head="trainer" value="${esc(S.trainer)}"></div><div class="field"><label class="lbl" for="f_du">Dauer</label><input id="f_du" data-head="dauer" value="${esc(S.dauer)}" placeholder="90 min"></div></div><div class="field"><label class="lbl" for="f_th">Thema</label><input id="f_th" data-head="thema" value="${esc(S.thema)}"></div></details>
  <details><summary>Worauf heute achten</summary><ul class="fokus">${c.fokus.map(f=>`<li>${esc(f)}</li>`).join("")}</ul></details>
 </section>`;
 h+=`<section class="card"><div class="h2row"><h2>Anwesend</h2><span class="big" id="anwN" aria-label="Anzahl anwesend">${S.anwesend.length}</span></div>`+grpTools();
 if(S.angemeldet.length){
  h+=`<h3>Angemeldet (${S.angemeldet.length})</h3><p class="hint" style="margin-top:-4px">${grpOn()?"Gruppe A oder B wählen. Wer nicht da ist, auf Fehlt tippen.":"Alle sind als da markiert. Wer fehlt, auf Fehlt tippen."}</p><div id="attList">${S.angemeldet.map(attRow).join("")}</div>`;
 }
 if(S.offen.length){h+=`<h3>Antwort offen (${S.offen.length})</h3><p class="hint" style="margin-top:-4px">Antippen, wenn das Kind doch kommt.</p><div class="chips">${S.offen.map(n=>chip(kader.find(k=>k.name===n)||{name:n,jg:""})).join("")}</div>`}
 if(S.abgesagt.length)h+=`<p class="hint" style="margin-top:12px">Abgesagt: ${S.abgesagt.map(disp).map(esc).join(", ")}</p>`;
 const prep=S.angemeldet.length||S.offen.length;
 const poolH=`<div class="field search"><label class="sr" for="q">Name suchen</label><input id="q" type="search" placeholder="Name suchen" value="${esc(ui.q)}" autocomplete="off"></div><div id="pool">${pool()}</div>`;
 h+=prep?`<details class="grp" ${ui.q||ui.other?"open":""}><summary>Weitere Kinder hinzufügen</summary>${poolH}</details>`:`<h3>Kinder auswählen</h3>${poolH}`;
 h+=`
  <details style="margin-top:12px"><summary>Gast oder Nachrücker ohne Kaderliste</summary>
   <div class="btnrow"><input id="gast" placeholder="Nachname, Vorname" aria-label="Name Gast" style="flex:2 1 200px"><button class="btn" data-act="gast">Hinzufügen</button></div></details>
 </section>`;
 h+=vGruppen();
 h+=`<button class="btn primary wide" data-act="tab" data-tab="bewerten" ${S.anwesend.length?"":"disabled"}>Weiter zum Bewerten</button>`;
 return h}
function attRow(n){const da=S.anwesend.includes(n),g=grpOf(n),k=esc(n);
 const btns=grpOn()?`<button class="seg ta" data-act="att" data-kid="${k}" data-v="A" aria-pressed="${da&&g==="A"}">A</button><button class="seg tb" data-act="att" data-kid="${k}" data-v="B" aria-pressed="${da&&g==="B"}">B</button>`
  :`<button class="seg ta" data-act="att" data-kid="${k}" data-v="da" aria-pressed="${da}">Da</button>`;
 return `<div class="attrow ${da?"":"fehlt"}"><span class="nm">${esc(disp(n))}${grpOn()&&da&&!g?'<br><span class="hint">da, ohne Gruppe</span>':""}</span><div class="segs" role="group" aria-label="${esc(disp(n))}">${btns}<button class="seg" data-act="att" data-kid="${k}" data-v="fehlt" aria-pressed="${!da}">Fehlt</button></div></div>`}
function chip(k){const on=S.anwesend.includes(k.name);return `<button type="button" class="chip" data-act="kid" data-kid="${esc(k.name)}" aria-pressed="${on}"><span class="ck" aria-hidden="true">✓</span>${esc(disp(k.name))}${k.jg?` <small>${esc(k.jg)}</small>`:""}</button>`}
function pool(){
 const c=CFG[S.ak],q=ui.q.trim().toLowerCase();
 const gaeste=S.anwesend.filter(n=>!kader.find(k=>k.name===n)&&!S.angemeldet.includes(n)&&!S.offen.includes(n)).map(n=>({name:n,jg:""}));
 if(!kader.length&&!gaeste.length)return `<div class="empty"><p>Noch kein Kader auf diesem Gerät.</p><button class="btn primary" data-act="panel" data-p="setup">Kader laden</button></div>`;
 const list=kader.filter(k=>!S.angemeldet.includes(k.name)&&!S.offen.includes(k.name));
 const hit=k=>!q||k.name.toLowerCase().includes(q)||disp(k.name).toLowerCase().includes(q);
 const by=(arr)=>arr.slice().sort((a,b)=>sortN(a.name,b.name));
 let h="";
 if(gaeste.length)h+=`<div class="grp"><div class="gh">Gäste</div><div class="chips">${gaeste.map(chip).join("")}</div></div>`;
 c.jgs.forEach((jg,i)=>{const a=by(list.filter(k=>+k.jg===jg&&hit(k)));if(a.length)h+=`<div class="grp"><div class="gh">Jahrgang ${jg}${i?" · jüngere":""}</div><div class="chips">${a.map(chip).join("")}</div></div>`});
 const rest=list.filter(k=>!c.jgs.includes(+k.jg));
 const restOn=rest.filter(k=>S.anwesend.includes(k.name));
 if(q){const a=by(rest.filter(hit));if(a.length)h+=`<div class="grp"><div class="gh">Andere Jahrgänge</div><div class="chips">${a.map(chip).join("")}</div></div>`}
 else if(ui.other){[...new Set(rest.map(k=>+k.jg))].sort((a,b)=>b-a).forEach(jg=>{h+=`<div class="grp"><div class="gh">Jahrgang ${jg||"?"}</div><div class="chips">${by(rest.filter(k=>+k.jg===jg)).map(chip).join("")}</div></div>`});
  h+=`<button class="btn ghost wide" style="margin-top:12px" data-act="other">Andere Jahrgänge ausblenden</button>`}
 else{if(restOn.length)h+=`<div class="grp"><div class="gh">Andere Jahrgänge</div><div class="chips">${by(restOn).map(chip).join("")}</div></div>`;
  h+=`<button class="btn ghost wide" style="margin-top:12px" data-act="other">Andere Jahrgänge zeigen (${rest.length})</button>`}
 if(q&&!h)h=`<p class="hint">Kein Kind gefunden. Unten als Gast hinzufügen.</p>`;
 return h}

function grpTools(){
 const cnt=g=>S.anwesend.filter(n=>grpOf(n)===g).length,ohne=S.anwesend.filter(n=>!grpOf(n)).length;
 let h=`<div class="btnrow" style="margin:4px 0 8px"><button class="seg" style="flex:1 1 auto" data-act="usegrp" aria-pressed="${grpOn()}">${grpOn()?"✓ ":""}In Gruppen A und B teilen</button></div>`;
 if(!grpOn())return h;
 return h+`<div class="teamhead"><span class="hint" style="margin:0">${ohne?ohne+" noch ohne Gruppe":"Alle eingeteilt"}</span><span><span class="pill a">A ${cnt("A")}</span> <span class="pill b">B ${cnt("B")}</span></span></div>
  <div class="btnrow" style="margin-bottom:6px"><button class="btn ghost" data-act="grprand">Zufällig teilen</button><button class="btn ghost" data-act="grpmw">Jungs A, Mädchen B</button></div>`}
function vGruppen(){
 if(!grpOn())return "";const l=S.anwesend.filter(n=>!S.angemeldet.includes(n));if(!l.length)return "";
 return `<section class="card"><h2>Gruppe für weitere Kinder</h2>${l.map(n=>{const v=grpOf(n);return `<div class="attrow"><span class="nm">${esc(disp(n))}</span><div class="segs" role="group" aria-label="Gruppe ${esc(disp(n))}"><button class="seg ta" data-act="grp" data-kid="${esc(n)}" data-v="A" aria-pressed="${v==="A"}">A</button><button class="seg tb" data-act="grp" data-kid="${esc(n)}" data-v="B" aria-pressed="${v==="B"}">B</button></div></div>`}).join("")}</section>`}
function gfBar(){if(!hasGrp())return "";const c=g=>S.anwesend.filter(n=>grpOf(n)===g).length;
 return `<div role="group" aria-label="Gruppe anzeigen" style="margin-bottom:10px">${segs("gf",S.gf,[["","Alle "+S.anwesend.length],["A","Gruppe A · "+c("A")],["B","Gruppe B · "+c("B")]],"fill")}</div>`}

// ---------- 2 Bewerten ----------
function vBewerten(){
 if(!S.anwesend.length)return emptyBox("Noch keine Kinder anwesend.",`<button class="btn primary" data-act="tab" data-tab="kinder">Kinder auswählen</button>`);
 let h=gfBar()+`<div role="group" aria-label="Ansicht">${segs("mode",ui.mode,[["kind","Pro Kind"],["krit","Pro Station"]],"fill")}</div>
  <p class="hint" style="margin:6px 0 4px">${ui.mode==="kind"?"Ein Kind komplett bewerten.":"Eine Station oder ein Kriterium, alle Kinder nacheinander."}</p>${legend()}`;
 return h+(ui.mode==="kind"?vKind():vKrit())}
function prog(n){const d=done(n),t=total();return `<span class="prog ${d>=t?"full":""}" data-prog="${esc(n)}">${d}/${t}</span>`}
function vKind(){
 if(!AL().length)return emptyBox("In dieser Gruppe ist noch kein Kind.");
 if(!ui.kid||!AL().includes(ui.kid))ui.kid=AL()[0];
 const n=ui.kid,c=CFG[S.ak],d=kidOf(n),i=AL().indexOf(n);
 let h=`<div class="kidstrip" role="group" aria-label="Kind wählen">${AL().map(k=>`<button class="chip" data-act="selkid" data-kid="${esc(k)}" aria-pressed="${k===n}">${esc(disp(k))} ${prog(k)}</button>`).join("")}</div>
 <section class="card"><div class="kidhead"><button class="iconbtn" data-act="step" data-v="-1" aria-label="Vorheriges Kind" ${i?"":"disabled"}>‹</button><h2>${esc(disp(n))}</h2>${prog(n)}<button class="iconbtn" data-act="step" data-v="1" aria-label="Nächstes Kind" ${i<AL().length-1?"":"disabled"}>›</button></div>
 <div class="sec">Messwerte</div><div class="mgrid">${c.mess.map((m,j)=>`<div><label for="m${j}">${esc(m)}</label><input id="m${j}" inputmode="decimal" data-mess="${esc(m)}" data-kid="${esc(n)}" value="${esc(d.mess[m]||"")}"></div>`).join("")}</div>
 <div class="sec">Motorik</div>${c.mot.map(m=>`<div class="rrow"><div class="rl"><b>${esc(m)}</b></div>${rate(n,"mot",m,d.mot[m],m)}</div>`).join("")}
 <div class="sec">Persönlichkeit</div>${PERS.map(p=>`<div class="rrow"><div class="rl"><b>${esc(p)}</b></div>${rate(n,"pers",p,d.pers[p],p)}</div>`).join("")}
 <div class="sec">Was fällt auf?</div><div class="chips" role="group" aria-label="Schnellnotizen">${TAGS.map(t=>`<button class="chip" data-act="tag" data-kid="${esc(n)}" data-v="${esc(t)}" aria-pressed="${d.tags.includes(t)}"><span class="ck" aria-hidden="true">✓</span>${esc(t)}</button>`).join("")}</div>
 <label class="sr" for="notiz">Notiz zu ${esc(disp(n))}</label><textarea id="notiz" style="margin-top:10px" data-notiz="1" data-kid="${esc(n)}" placeholder="Notiz zu ${esc(disp(n))}">${esc(d.notiz)}</textarea>
 </section>`;
 h+=i<AL().length-1?`<button class="btn primary wide" data-act="step" data-v="1">Weiter zu ${esc(disp(AL()[i+1]))}</button>`:`<button class="btn primary wide" data-act="tab" data-tab="${tabsFor()[2][0]}">Alle Kinder durch, weiter</button>`;
 return h}
function vKrit(){
 const cs=crits();if(ui.krit>=cs.length)ui.krit=0;const k=cs[ui.krit];
 const secs=[...new Set(cs.map(x=>x.sec))];
 let h=`<section class="card kritbar">${secs.map(s=>`<div><div class="gh" style="font-size:13px;font-weight:700;color:var(--ink2);text-transform:uppercase;margin:4px 0">${s}</div><div class="chips">${cs.map((x,i)=>x.sec===s?`<button class="chip" data-act="krit" data-v="${i}" aria-pressed="${i===ui.krit}">${esc(x.k)}</button>`:"").join("")}</div></div>`).join("")}</section>
 <section class="card"><h2>${esc(k.k)}</h2>`;
 h+=AL().map((n,j)=>{const d=kidOf(n);
  return `<div class="rrow mrow"><div class="rl"><b>${esc(disp(n))}</b></div>${k.g==="mess"?`<label class="sr" for="km${j}">${esc(k.k)} ${esc(disp(n))}</label><input id="km${j}" inputmode="decimal" data-mess="${esc(k.k)}" data-kid="${esc(n)}" value="${esc(d.mess[k.k]||"")}">`:rate(n,k.g,k.k,d[k.g][k.k],k.k+" "+disp(n))}</div>`}).join("");
 h+=`</section>`+(ui.krit<cs.length-1?`<button class="btn primary wide" data-act="krit" data-v="${ui.krit+1}">Weiter zu ${esc(cs[ui.krit+1].k)}</button>`:"");
 return h}

// ---------- 3 Staffeln ----------
function vStaffeln(){
 if(!S.anwesend.length)return emptyBox("Noch keine Kinder anwesend.",`<button class="btn primary" data-act="tab" data-tab="kinder">Kinder auswählen</button>`);
 if(ui.openSt<0||ui.openSt>=S.staffeln.length)ui.openSt=S.staffeln.length-1;
 let h=gfBar()+`<p class="hint" style="margin:0 0 10px">Töpfe und Übungen wie im DTB Talent Cup. Je Staffel Teams einteilen, Ergebnis und Sieger eintragen.</p>`;
 h+=S.staffeln.map((st,i)=>stCard(st,i)).join("");
 h+=`<button class="btn ${S.staffeln.length?"":"primary"} wide" data-act="stadd" style="margin-bottom:14px">+ Neue Staffel</button>`;
 if(S.staffeln.length){if(ui.stKrit>=ST_KRIT.length)ui.stKrit=0;const k=ST_KRIT[ui.stKrit];
  h+=`<section class="card"><h2>Beitrag je Kind</h2><p class="hint" style="margin-top:-6px">Über alle Staffeln. Kriterium wählen, dann alle Kinder bewerten.</p>${legend()}
   <div class="chips" style="margin-bottom:8px">${ST_KRIT.map((x,i)=>`<button class="chip" data-act="stkrit" data-v="${i}" aria-pressed="${i===ui.stKrit}">${esc(x)}</button>`).join("")}</div>
   ${AL().map(n=>{const d=S.staffelKinder[n]||{};const ein=S.staffeln.filter(s=>s.teams&&s.teams[n]).length;return `<div class="rrow"><div class="rl"><b>${esc(disp(n))}</b><span class="hint">${ein} von ${S.staffeln.length} Staffeln</span></div>${rate(n,"st",k,d[k],k+" "+disp(n))}</div>`}).join("")}</section>`}
 return h}
function stCard(st,i){st.teams=st.teams||{};const A=AL().filter(n=>st.teams[n]==="A").length,B=AL().filter(n=>st.teams[n]==="B").length;
 return `<details class="card stcard" data-sti="${i}" ${i===ui.openSt?"open":""}><summary><span>Staffel ${i+1}</span><span class="sm">${esc(st.topf)} · ${esc(st.uebung)}${st.sieger?" · Sieger "+esc(st.sieger):""}</span></summary>
  <div class="field"><span class="lbl">Topf</span>${segs("sttopf",st.topf,Object.keys(TOEPFE).map(t=>[t,t]),"two").replace(/data-act="sttopf"/g,`data-act="sttopf" data-si="${i}"`)}</div>
  <div class="field"><label class="lbl" for="stu${i}">Übung</label><select id="stu${i}" data-st="uebung" data-si="${i}">${TOEPFE[st.topf].map(x=>`<option ${st.uebung===x?"selected":""}>${esc(x)}</option>`).join("")}</select></div>
  <div class="teamhead"><span class="lbl" style="margin:0">Teams</span><span><span class="pill a">A ${A}</span> <span class="pill b">B ${B}</span></span></div>
  <div class="btnrow" style="margin-bottom:6px">${i?`<button class="btn ghost" data-act="stcopy" data-si="${i}">Wie Staffel ${i}</button>`:""}<button class="btn ghost" data-act="strand" data-si="${i}">Zufällig teilen</button></div>
  ${AL().map(n=>{const v=st.teams[n]||"";return `<div class="attrow"><span class="nm">${esc(disp(n))}</span><div class="segs" role="group" aria-label="Team ${esc(disp(n))}">
   <button class="seg ta" data-act="team" data-si="${i}" data-kid="${esc(n)}" data-v="A" aria-pressed="${v==="A"}">A</button><button class="seg tb" data-act="team" data-si="${i}" data-kid="${esc(n)}" data-v="B" aria-pressed="${v==="B"}">B</button><button class="seg" data-act="team" data-si="${i}" data-kid="${esc(n)}" data-v="" aria-pressed="${v===""}" aria-label="nicht dabei">–</button></div></div>`}).join("")}
  <div class="grid2" style="margin-top:12px"><div class="field"><label class="lbl" for="sta${i}">Ergebnis A</label><input id="sta${i}" data-st="ergA" data-si="${i}" value="${esc(st.ergA)}" placeholder="z. B. 12,4 s"></div><div class="field"><label class="lbl" for="stb${i}">Ergebnis B</label><input id="stb${i}" data-st="ergB" data-si="${i}" value="${esc(st.ergB)}" placeholder="z. B. 12,4 s"></div></div>
  <div class="field"><span class="lbl">Sieger</span>${segs("stsieger",st.sieger,[["A","Team A"],["B","Team B"],["Unentschieden","Gleich"]],"fill").replace(/data-act="stsieger"/g,`data-act="stsieger" data-si="${i}"`)}</div>
  <div class="field"><label class="lbl" for="stf${i}">Fehler und Wiederholungen</label><input id="stf${i}" data-st="fehler" data-si="${i}" value="${esc(st.fehler)}"></div>
  <div class="field"><label class="lbl" for="stm${i}">Bemerkung</label><input id="stm${i}" data-st="bem" data-si="${i}" value="${esc(st.bem)}"></div>
  <button class="btn danger" data-act="stdel" data-si="${i}">Staffel ${i+1} löschen</button></details>`}

// ---------- 4 Abschluss ----------
function vAbschluss(){
 const g=S.gruppe,c=CFG[S.ak],t=total();
 const fehlt=S.angemeldet.filter(n=>!S.anwesend.includes(n));
 const ohne=S.anwesend.filter(n=>!done(n));
 let h=`<section class="card"><h2>Gruppe</h2>
  <div class="field"><label class="lbl" for="g_in">Inhalte und Übungen</label><textarea id="g_in" data-grp="inhalte">${esc(g.inhalte)}</textarea></div>
  <div class="field"><span class="lbl" id="rpel">Belastung der Gruppe (RPE 1 bis 10)</span><div role="group" aria-labelledby="rpel">${segs("rpe",String(g.rpe),Array.from({length:10},(_,i)=>[String(i+1),String(i+1)]),"fill")}</div></div>
  <div class="field"><label class="lbl" for="g_st">Stimmung</label><div class="chips" style="margin-bottom:8px">${STIMMUNG.map(s=>`<button class="chip" data-act="stimm" data-v="${s}" aria-pressed="${g.stimmung===s}">${s}</button>`).join("")}</div><input id="g_st" data-grp="stimmung" value="${esc(g.stimmung)}" placeholder="oder eigene Beschreibung"></div>
  <div class="field"><label class="lbl" for="g_be">Absagen, Ausfälle, Besonderheiten</label><textarea id="g_be" data-grp="bes">${esc(g.bes)}</textarea></div>
  <div class="field"><label class="lbl" for="g_fr">Offene Fragen und Aufträge</label><textarea id="g_fr" data-grp="fragen">${esc(g.fragen)}</textarea></div></section>`;
 h+=`<section class="card"><div class="h2row"><h2>Übersicht</h2><span class="hint">${S.anwesend.length} da${fehlt.length?" · "+fehlt.length+" fehlen":""}</span></div>`;
 if(ohne.length)h+=`<div class="warn">${ohne.length===1?"1 Kind hat":ohne.length+" Kinder haben"} noch keine Bewertung: ${ohne.map(disp).map(esc).join(", ")}</div>`;
 h+=S.anwesend.length?`<table><thead><tr><th>Kind</th>${hasGrp()?"<th>Gr.</th>":""}<th>Werte</th><th>Notiz</th>${c.staffel?"<th>Staffeln</th>":""}</tr></thead><tbody>${S.anwesend.map(n=>{const d=S.kinder[n]||{};const nz=(d.notiz||"").trim()||(d.tags||[]).length;return `<tr><td><button class="link" data-act="gokid" data-kid="${esc(n)}">${esc(disp(n))}</button></td>${hasGrp()?`<td>${grpOf(n)||"–"}</td>`:""}<td>${done(n)}/${t}</td><td>${nz?"✓":"–"}</td>${c.staffel?`<td>${S.staffeln.filter(s=>s.teams&&s.teams[n]).length}</td>`:""}</tr>`}).join("")}</tbody></table>`:`<p class="hint">Noch keine Kinder anwesend.</p>`;
 if(fehlt.length)h+=`<p class="hint">Fehlt: ${fehlt.map(disp).map(esc).join(", ")}</p>`;
 h+=`</section><section class="card"><h2>Speichern</h2>
  <p class="hint" style="margin:-4px 0 12px">${S.synced?"Diese Einheit ist hochgeladen ("+esc(S.syncedAt||"")+"). Claude kann sie lesen.":"Alles ist auf diesem Gerät gespeichert. Erst nach dem Hochladen kann Claude die Einheit lesen."}</p>
  <button class="btn primary wide" data-act="push" id="pushBtn">${S.synced?"Erneut hochladen":"In GitHub hochladen"}</button>
  <div class="btnrow" style="margin-top:10px"><button class="btn ghost" data-act="copy">Als Text kopieren</button><button class="btn ghost" data-act="json">JSON herunterladen</button></div>
  <button class="btn ghost wide" style="margin-top:10px" data-act="neu">Neue leere Einheit beginnen</button></section>`;
 return h}

// ---------- Panels ----------
function openSheet(){$("overlay").classList.add("on");$("sheet").classList.add("on");$("sheet").querySelector("button").focus()}
function closeAll(){["overlay","sheet","panel"].forEach(i=>$(i).classList.remove("on"));document.body.style.overflow=""}
function openPanel(p){closeAll();$("panel").classList.add("on");document.body.style.overflow="hidden";$("panelT").textContent=p==="verlauf"?"Verlauf":"Kader und GitHub";$("panel").dataset.p=p;renderPanel();$("panelT").focus()}
function renderPanel(){const p=$("panel").dataset.p,b=$("panelBody");
 if(p==="verlauf"){const h=store.get("ick_hist",{});const list=Object.values(h).sort((a,b)=>(b.datum||"").localeCompare(a.datum||""));
  b.innerHTML=`<section class="card"><h2>Vorbereitete Einheiten</h2><p class="hint" style="margin:-4px 0 12px">Von Claude mit Namen vorbereitet. Schon geladene Einheiten werden nie überschrieben.</p><button class="btn primary wide" data-act="prep">Jetzt aus GitHub laden</button></section>
  <section class="card"><h2>Auf diesem Gerät</h2>${list.map(e=>`<div class="attrow hrow"><div class="meta"><b>${esc(e.ak)} · ${esc(fmtD(e.datum))}${e.lg?" · LG "+esc(e.lg):""}</b>${e.id===S.id?'<span class="tag cur">offen</span>':""}${e.synced?'<span class="tag up">hochgeladen</span>':e.vorbereitet&&!e.changed?'<span class="tag prep">vorbereitet</span>':""}<br><span class="hint">${(e.anwesend||[]).length} Kinder${(e.angemeldet||[]).length?" von "+e.angemeldet.length+" angemeldet":""}</span></div>
   ${e.id===S.id?"":`<button class="btn" data-act="hopen" data-id="${e.id}">Öffnen</button>`}<button class="iconbtn" data-act="hdel" data-id="${e.id}" aria-label="Einheit löschen">✕</button></div>`).join("")||'<p class="hint">Noch nichts gespeichert.</p>'}</section>`}
 else{b.innerHTML=`<section class="card"><h2>1 GitHub Verbindung</h2><p class="hint" style="margin:-4px 0 12px">Einheiten werden in dein privates Repo geschrieben. Der Token bleibt nur in diesem Browser.</p>
   <div class="field"><label class="lbl" for="s_repo">Repo</label><input id="s_repo" value="${esc(sync.repo)}"></div>
   <div class="field"><label class="lbl" for="s_tok">Token</label><input id="s_tok" type="password" autocomplete="off" value="${esc(sync.token)}" placeholder="github_pat_…"><p class="hint">Fine-grained Token, nur für ickern-daten, Contents Read and write.</p></div>
   <div class="field"><label class="lbl" for="s_br">Branch</label><input id="s_br" value="${esc(sync.branch)}"></div>
   <div class="btnrow"><button class="btn primary" data-act="syncsave">Speichern und testen</button></div></section>
  <section class="card"><h2>2 Kader</h2><p class="hint" style="margin:-4px 0 12px">${kader.length?kader.length+" Kinder auf diesem Gerät.":"Noch kein Kader auf diesem Gerät."} Namen stehen nie im öffentlichen Code der Seite.</p>
   <button class="btn primary wide" data-act="kload">Kader aus GitHub laden</button>
   <details style="margin-top:10px"><summary>Kader von Hand bearbeiten</summary><p class="hint">Je Zeile: Nachname, Vorname, Jahrgang, m oder w</p><textarea id="kText" style="min-height:200px">${esc(kader.map(k=>[k.name,k.jg,k.g].filter(x=>x!=="").join(", ")).join("\n"))}</textarea><button class="btn" style="margin-top:8px" data-act="ksave">Kader speichern</button></details></section>`}}

// ---------- Aktionen ----------
function setKid(n,on){if(on){if(!S.anwesend.includes(n))S.anwesend.push(n)}else S.anwesend=S.anwesend.filter(x=>x!==n);save();const a=$("anwN");if(a)a.textContent=S.anwesend.length}
function updProg(n){document.querySelectorAll("[data-prog]").forEach(e=>{if(e.dataset.prog===n){const d=done(n),t=total();e.textContent=d+"/"+t;e.classList.toggle("full",d>=t)}})}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}

document.addEventListener("click",async e=>{
 const t=e.target.closest("[data-act]");if(!t||t.disabled)return;const a=t.dataset.act,n=t.dataset.kid,v=t.dataset.v,si=+t.dataset.si;
 switch(a){
 case "tab":closeAll();go(t.dataset.tab);break;
 case "menu":openSheet();break;
 case "close":closeAll();break;
 case "panel":openPanel(t.dataset.p);break;
 case "ak":S.ak=v;save();render();break;
 case "kid":{const on=t.getAttribute("aria-pressed")!=="true";setKid(n,on);t.setAttribute("aria-pressed",on);break}
 case "att":{if(v==="A"||v==="B"){setKid(n,true);S.gruppen[n]=v}else if(v==="fehlt"){setKid(n,false);delete S.gruppen[n]}else setKid(n,true);save();render();break}
 case "usegrp":{if(grpOn()){const old={...S.gruppen},og=S.gf;S.useGrp=false;S.gruppen={};S.gf="";save();render();if(Object.values(old).some(Boolean))toast("Gruppen aufgehoben",{label:"Rückgängig",fn:()=>{S.gruppen=old;S.gf=og;S.useGrp=true;save();render()}})}else{S.useGrp=true;save();render()}break}
 case "other":ui.other=!ui.other;$("pool").innerHTML=pool();break;
 case "gast":{const g=$("gast").value.trim();if(!g)return toast("Bitte einen Namen eingeben");setKid(g,true);$("gast").value="";$("pool").innerHTML=pool();toast(disp(g)+" hinzugefügt");break}
 case "mode":ui.mode=v;render();break;
 case "grp":S.gruppen[n]=grpOf(n)===v?"":v;save();render();break;
 case "grprand":S.gruppen={};shuffle(S.anwesend).forEach((k,j)=>S.gruppen[k]=j%2?"B":"A");save();render();break;
 case "grpmw":{const gg=n=>(kader.find(k=>k.name===n)||{}).g;S.anwesend.forEach(k=>{const x=gg(k);S.gruppen[k]=x==="m"?"A":x==="w"?"B":(S.gruppen[k]||"")});save();render();if(S.anwesend.some(k=>!gg(k)))toast("Bei Gästen ohne Angabe bitte von Hand wählen");break}
 case "grpclear":{const old={...S.gruppen},og=S.gf;S.gruppen={};S.gf="";save();render();toast("Gruppen aufgehoben",{label:"Rückgängig",fn:()=>{S.gruppen=old;S.gf=og;save();render()}});break}
 case "gf":S.gf=v;ui.kid=null;save();render();break;
 case "selkid":ui.kid=n;render();break;
 case "gokid":ui.mode="kind";ui.kid=n;go("bewerten");break;
 case "step":{const i=AL().indexOf(ui.kid)+(+v);if(AL()[i]){ui.kid=AL()[i];render();window.scrollTo(0,0);const s=document.querySelector('.kidstrip [aria-pressed="true"]');if(s)s.scrollIntoView({inline:"center",block:"nearest"})}break}
 case "krit":ui.krit=+v;render();window.scrollTo(0,0);break;
 case "rate":{const g=t.dataset.g,k=t.dataset.k,r=t.dataset.r;const o=g==="st"?(S.staffelKinder[n]||(S.staffelKinder[n]={})):kidOf(n)[g];o[k]=o[k]===r?"":r;save();
  t.parentElement.querySelectorAll("button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.r===o[k]));if(g!=="st")updProg(n);head();break}
 case "tag":{const d=kidOf(n);d.tags=d.tags.includes(v)?d.tags.filter(x=>x!==v):[...d.tags,v];save();t.setAttribute("aria-pressed",d.tags.includes(v));break}
 case "stadd":{const prev=S.staffeln[S.staffeln.length-1];S.staffeln.push({topf:"Lauf",uebung:"Grundliniensprint",teams:prev?{...prev.teams}:{},ergA:"",ergB:"",sieger:"",fehler:"",bem:""});ui.openSt=S.staffeln.length-1;save();render();
  const c=document.querySelector(`[data-sti="${ui.openSt}"]`);if(c)c.scrollIntoView({block:"start"});break}
 case "stdel":{const st=S.staffeln.splice(si,1)[0];save();render();toast(`Staffel ${si+1} gelöscht`,{label:"Rückgängig",fn:()=>{S.staffeln.splice(si,0,st);ui.openSt=si;save();render()}});break}
 case "sttopf":{const st=S.staffeln[si];st.topf=v;st.uebung=TOEPFE[v][0];ui.openSt=si;save();render();break}
 case "stsieger":{const st=S.staffeln[si];st.sieger=st.sieger===v?"":v;ui.openSt=si;save();render();break}
 case "team":{const st=S.staffeln[si];st.teams[n]=v;ui.openSt=si;save();render();break}
 case "stcopy":S.staffeln[si].teams={...S.staffeln[si-1].teams};ui.openSt=si;save();render();toast("Teams übernommen");break;
 case "strand":{const st=S.staffeln[si];st.teams={};shuffle(AL()).forEach((k,j)=>st.teams[k]=j%2?"B":"A");ui.openSt=si;save();render();break}
 case "stkrit":ui.stKrit=+v;render();break;
 case "rpe":S.gruppe.rpe=S.gruppe.rpe===v?"":v;save();render();break;
 case "stimm":S.gruppe.stimmung=S.gruppe.stimmung===v?"":v;save();render();break;
 case "push":push(t);break;
 case "copy":{const txt=toMarkdown(S);try{await navigator.clipboard.writeText(txt);toast("Text kopiert. Jetzt im Claude Projekt einfügen.")}catch(err){prompt("Text kopieren:",txt)}break}
 case "json":{const l=document.createElement("a");l.href=URL.createObjectURL(new Blob([JSON.stringify(S,null,1)],{type:"application/json"}));l.download=`einheit_${S.datum}_${S.ak}.json`;l.click();break}
 case "neu":{const old=S;persist();S=neu();S.ak=old.ak;persist();closeAll();ui.kid=null;go("kinder");toast("Neue Einheit begonnen",{label:"Zurück",fn:()=>{S=old;persist();render()}});break}
 case "hopen":{const h=store.get("ick_hist",{});S=norm(h[t.dataset.id]);ui.kid=null;persist();closeAll();go("kinder");toast("Einheit geöffnet");break}
 case "hdel":{const h=store.get("ick_hist",{}),id=t.dataset.id,old=h[id];delete h[id];store.set("ick_hist",h);if(id===S.id){S=neu();store.set("ick_current",S)}renderPanel();render();
  toast("Einheit vom Gerät gelöscht",{label:"Rückgängig",fn:()=>{const x=store.get("ick_hist",{});x[id]=old;store.set("ick_hist",x);renderPanel()}});break}
 case "prep":ladePrep(false);break;
 case "syncsave":{sync={repo:$("s_repo").value.trim(),branch:$("s_br").value.trim()||"main",token:$("s_tok").value.trim()};store.set("ick_sync",sync);
  if(!sync.token)return toast("Token fehlt");try{const r=await fetch(`https://api.github.com/repos/${sync.repo}`,{headers:{"Authorization":"Bearer "+sync.token}});toast(r.ok?"Verbindung klappt":"GitHub meldet Fehler "+r.status+". Token und Repo prüfen.")}catch(err){toast("Keine Verbindung zum Internet")}break}
 case "kload":{if(!sync.token)return toast("Erst den Token oben eintragen");try{const r=await gh("kader.csv");if(!r.ok)return toast("kader.csv nicht gefunden (Fehler "+r.status+")");const j=await r.json();kader=parseKader(dec(j.content));store.set("ick_kader",kader);renderPanel();toast(kader.length+" Kinder geladen")}catch(err){toast("Laden fehlgeschlagen")}break}
 case "ksave":kader=parseKader($("kText").value);store.set("ick_kader",kader);renderPanel();toast(kader.length+" Kinder gespeichert");break;
 }
});
document.addEventListener("input",e=>{const t=e.target,d=t.dataset;
 if(t.id==="q"){ui.q=t.value;$("pool").innerHTML=pool();return}
 if(d.head){S[d.head]=t.value;save();return}
 if(d.grp){S.gruppe[d.grp]=t.value;save();return}
 if(d.mess){kidOf(d.kid).mess[d.mess]=t.value.replace(",",".").trim()===""?"":t.value;save();updProg(d.kid);return}
 if(d.notiz){kidOf(d.kid).notiz=t.value;save();return}
 if(d.st){const st=S.staffeln[+d.si];st[d.st]=t.value;save();if(d.st==="uebung"){const s=t.closest("details").querySelector(".sm");if(s)s.textContent=st.topf+" · "+st.uebung+(st.sieger?" · Sieger "+st.sieger:"")}}
});
document.addEventListener("toggle",e=>{if(e.target.dataset&&e.target.dataset.sti!==undefined&&e.target.open)ui.openSt=+e.target.dataset.sti},true);
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeAll()});

// ---------- GitHub ----------
async function gh(path,opt={}){return fetch(`https://api.github.com/repos/${sync.repo}/contents/${path}`+(opt.method?"":`?ref=${encodeURIComponent(sync.branch)}`),{...opt,headers:{"Authorization":"Bearer "+sync.token,"Accept":"application/vnd.github+json",...(opt.headers||{})}})}
const b64=s=>btoa(unescape(encodeURIComponent(s)));
const dec=c=>decodeURIComponent(escape(atob(c.replace(/\n/g,""))));
function parseKader(t){return t.split(/\n/).map(l=>l.trim()).filter(Boolean).map(l=>{const p=l.split(",").map(x=>x.trim());return{name:p[0]+(p[1]?", "+p[1]:""),jg:p[2]||"",g:p[3]||""}})}
async function push(btn){
 if(!sync.token){toast("Erst GitHub verbinden",{label:"Einrichten",fn:()=>openPanel("setup")});return}
 btn.disabled=true;btn.textContent="Wird hochgeladen …";
 const base=`einheiten/${S.datum}_${S.ak}${S.lg?"_LG"+S.lg:""}_${S.id}`;
 try{const snap={...S,synced:true};for(const [ext,body] of [["json",JSON.stringify(snap,null,1)],["md",toMarkdown(S)]]){
   const path=`${base}.${ext}`;let sha;const ex=await gh(path);if(ex.ok)sha=(await ex.json()).sha;
   const r=await gh(path,{method:"PUT",body:JSON.stringify({message:`Einheit ${S.datum} ${S.ak}`,content:b64(body),branch:sync.branch,...(sha?{sha}:{})})});
   if(!r.ok)throw new Error(r.status)}
  S.synced=true;S.syncedAt=new Date().toLocaleTimeString("de-DE",{hour:"2-digit",minute:"2-digit"});persist();render();toast("Hochgeladen. Claude kann die Einheit jetzt lesen.")}
 catch(err){btn.disabled=false;btn.textContent="Erneut versuchen";toast(err.message==="401"||err.message==="403"?"Token ungültig oder ohne Schreibrecht":"Hochladen fehlgeschlagen ("+err.message+"). Daten bleiben auf dem Gerät.")}}
async function ladePrep(silent){
 if(!sync.token){if(!silent)toast("Erst GitHub verbinden",{label:"Einrichten",fn:()=>openPanel("setup")});return}
 try{const r=await gh("vorbereitet");if(!r.ok){if(!silent)toast(r.status==404?"Keine vorbereiteten Einheiten":"Fehler "+r.status);return}
  const files=(await r.json()).filter(f=>f.name.endsWith(".json"));const h=store.get("ick_hist",{});const neuL=[];
  for(const f of files){const x=await gh("vorbereitet/"+f.name);if(!x.ok)continue;const e=JSON.parse(dec((await x.json()).content));
   if(!e.id||h[e.id])continue;const ang=e.angemeldet||e.anwesend||[];const m=norm({...e,angemeldet:[...ang],anwesend:[...(e.anwesend||ang)],vorbereitet:true});m.changed=0;h[m.id]=m;neuL.push(m)}
  store.set("ick_hist",h);if($("panel").classList.contains("on"))renderPanel();
  if(neuL.length){neuL.sort((a,b)=>a.datum.localeCompare(b.datum));const nx=neuL.find(x=>x.datum>=today())||neuL[neuL.length-1];
   toast(`${neuL.length} vorbereitete Einheit${neuL.length>1?"en":""} geladen`,{label:"Öffnen",fn:()=>{S=norm(store.get("ick_hist",{})[nx.id]);persist();closeAll();go("kinder")}})}
  else if(!silent)toast("Nichts Neues")}catch(err){if(!silent)toast("Laden fehlgeschlagen")}}

// ---------- Export ----------
function toMarkdown(e){
 let m=`# Einheit ${e.datum} · ${e.ak}${e.lg?" · LG "+e.lg:""}\n\nTrainer: ${e.trainer} · Dauer: ${e.dauer} · Thema: ${e.thema}\nAnwesend (${e.anwesend.length}): ${e.anwesend.join(" | ")}\n`;
 const fehlt=(e.angemeldet||[]).filter(n=>!e.anwesend.includes(n));if(fehlt.length)m+=`Angemeldet, aber gefehlt (${fehlt.length}): ${fehlt.join(" | ")}\n`;const of=(e.offen||[]).filter(n=>!e.anwesend.includes(n));if(of.length)m+=`Antwort offen, nicht gekommen (${of.length}): ${of.join(" | ")}\n`;if((e.abgesagt||[]).length)m+=`Abgesagt (${e.abgesagt.length}): ${e.abgesagt.join(" | ")}\n`;const gr=e.gruppen||{};["A","B"].forEach(g=>{const l=e.anwesend.filter(n=>gr[n]===g);if(l.length)m+=`Gruppe ${g} (${l.length}): ${l.join(" | ")}\n`});m+="\n";
 const j=o=>Object.entries(o||{}).filter(([k,v])=>v).map(([k,v])=>k+" "+v).join(", ");
 e.anwesend.forEach(n=>{const d=e.kinder[n];if(!d)return;const mess=j(d.mess),mot=j(d.mot),pers=j(d.pers),tg=(d.tags||[]).join(", ");if(!mess&&!mot&&!pers&&!tg&&!d.notiz)return;
  m+=`## ${n}${(e.gruppen||{})[n]?" (Gruppe "+e.gruppen[n]+")":""}\n`+(mess?`* Messwerte: ${mess}\n`:"")+(mot?`* Motorik: ${mot}\n`:"")+(pers?`* Persönlichkeit: ${pers}\n`:"")+(tg?`* Auffällig: ${tg}\n`:"")+(d.notiz?`* Notiz: ${d.notiz}\n`:"")+"\n"});
 if(e.staffeln.length){m+="## Staffeln\n";e.staffeln.forEach((s,i)=>{const A=Object.keys(s.teams||{}).filter(k=>s.teams[k]==="A"),B=Object.keys(s.teams||{}).filter(k=>s.teams[k]==="B");
  m+=`* Staffel ${i+1}: ${s.topf}, ${s.uebung}. Team A (${A.join(" | ")}): ${s.ergA}. Team B (${B.join(" | ")}): ${s.ergB}. Sieger ${s.sieger}. ${s.fehler?"Fehler: "+s.fehler+". ":""}${s.bem}\n`});
  Object.entries(e.staffelKinder).forEach(([n,d])=>{const t=j(d);if(t)m+=`* ${n}: ${t}\n`});m+="\n"}
 const g=e.gruppe;m+=`## Gruppe\n* Inhalte: ${g.inhalte}\n* RPE: ${g.rpe} · Stimmung: ${g.stimmung}\n* Besonderheiten: ${g.bes}\n* Offene Fragen: ${g.fragen}\n`;
 return m}

// ---------- Bildschirm wach halten während der Einheit ----------
let wl;async function wake(){try{if("wakeLock" in navigator&&document.visibilityState==="visible")wl=await navigator.wakeLock.request("screen")}catch(e){}}
document.addEventListener("visibilitychange",wake);document.addEventListener("click",function f(){wake();document.removeEventListener("click",f)});

render();setTimeout(()=>ladePrep(true),600);
</script>
